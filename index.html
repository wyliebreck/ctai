<!doctype html>
<html>
  <head>
		<title>Question maker</title>
    <link rel="stylesheet" href="style.css">
    <script src="code.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
  </head>
  <body>
    <h1>Question maker</h1>
    <p>
      This tool will help you to make multiple-choice questions about the content of a given PDF document.
    </p>
    <p>
      Choose the PDF you would like to use:
    </p>
    <input id="file" type="file">
    <p>
      Enter your API key:
    </p>
    <input id="key" type="text">
    <button onclick="perform()">Suggest some questions</button>
    <div id="output"></div>
  </body>
</html>
